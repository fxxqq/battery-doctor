<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;font-family:-apple-system,"PingFang SC",sans-serif;
background:linear-gradient(135deg,#0f1b12 0%,#16241a 55%,#1c2b20 100%);
display:flex;align-items:center;padding:0 90px;color:#f2f2f7}
.icon{width:260px;height:260px;border-radius:58px;box-shadow:0 24px 60px rgba(0,0,0,.55);flex:none}
.txt{margin-left:64px;flex:1}
h1{font-size:64px;font-weight:700;letter-spacing:1px}
h1 small{font-size:30px;color:#8fbf9f;font-weight:500;margin-left:16px}
.sub{font-size:24px;color:#b9c4bd;margin-top:18px;line-height:1.5}
.badges{margin-top:34px;display:flex;gap:14px}
.badge{font-size:19px;padding:9px 20px;border-radius:999px;border:1px solid rgba(143,191,159,.45);color:#cfe3d5}
.badge.hot{background:#2e9e5b;border-color:#2e9e5b;color:#fff}
.foot{position:absolute;bottom:44px;left:90px;font-size:19px;color:#6f7f75;letter-spacing:.5px}
</style></head><body>
<img class="icon" src="assets/AppIcon.png">
<div class="txt">
  <h1>电池医生<small>Battery Doctor</small></h1>
  <div class="sub">笔记本莫名关机？每 5 秒采样做断电取证，<br>给归因结论而不只是读数。</div>
  <div class="badges">
    <span class="badge hot">macOS dmg</span>
    <span class="badge">Windows exe</span>
    <span class="badge">全程本地 · 零联网</span>
    <span class="badge">MIT 开源</span>
  </div>
</div>
<div class="foot">v5pc.com/battery · github.com/fxxqq/battery-doctor</div>
</body></html>
